[package]
name = "web3guard_accel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Selective Rust acceleration for Web3Guard (hashing, secret scanning, import extraction)"

[lib]
name = "web3guard_accel"
# cdylib: importable Python extension module via PyO3.
# rlib: allows the crate to be unit-tested natively with cargo test.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
sha2 = "0.10"
regex = "1.10"
once_cell = "1.19"

[profile.release]
lto = true
codegen-units = 1
