name: Web3Guard Bounty Hunter

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets_config:
        description: "Targets, one per line: <git-url>|<budget> (max or number)"
        required: true
        type: string
        default: |
          https://github.com/your-target/repo-A|max
      min_severity:
        description: "Minimum severity to report (INFO | LOW | MEDIUM | HIGH | CRITICAL)"
        required: false
        type: choice
        default: LOW
        options:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      enable_exploit:
        description: "Generate Foundry / Anchor / Move / Scarb / Clarinet / Blueprint PoCs"
        required: false
        type: boolean
        default: true
      enable_self_critique:
        description: "Adversarial self-critique pass on every finding"
        required: false
        type: boolean
        default: true
      fork_url:
        description: "Optional mainnet RPC URL for fork-based PoCs"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * 0"  # weekly on Sunday at 06:00 UTC

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate package and run tests
        run: |
          python -m pip check
          python -m compileall -q web3guard tests
          python -m pytest -q

  bench:
    name: Benchmark (precision/recall gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate corpus manifests
        run: |
          python -m web3guard.cli bench --validate
          python -m web3guard.cli bench --corpus bench/smartbugs/corpus.json --validate

      - name: Run benchmark with regression floor (in-repo corpus)
        run: |
          python -m web3guard.cli bench \
            --fail-below 0.99,0.95 \
            --json bench/reports/current.json

      - name: Diff in-repo benchmark vs committed baseline
        run: |
          python -m web3guard.cli bench \
            --diff bench/reports/test-contracts-baseline.json

      - name: Run benchmark with regression floor (SmartBugs corpus)
        run: |
          python -m web3guard.cli bench \
            --corpus bench/smartbugs/corpus.json \
            --fail-below 1.0,0.8 \
            --json bench/smartbugs/reports/current.json

      - name: Diff SmartBugs benchmark vs committed baseline
        run: |
          python -m web3guard.cli bench \
            --corpus bench/smartbugs/corpus.json \
            --diff bench/smartbugs/reports/baseline.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web3guard-benchmark-${{ github.run_id }}
          path: |
            bench/reports/current.json
            bench/smartbugs/reports/current.json
          if-no-files-found: warn

  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Foundry
        id: cache-foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: ${{ runner.os }}-foundry-nightly
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install Foundry
        if: steps.cache-foundry.outputs.cache-hit != 'true'
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup --install nightly

      - name: Verify toolchain
        run: |
          python --version
          forge --version || true
          slither --version || true
          aderyn --version || true
          myth --version || true
          echidna --version || true
          gitleaks version || true
          semgrep --version || true

      - name: Run Web3Guard
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGETS_CONFIG: ${{ inputs.targets_config || vars.WEB3GUARD_TARGETS_CONFIG || '' }}
          MIN_SEVERITY: ${{ inputs.min_severity || 'LOW' }}
          FORK_URL: ${{ inputs.fork_url || '' }}
          ENABLE_EXPLOIT: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_exploit }}
          ENABLE_SELF_CRITIQUE: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_self_critique }}
        run: |
          set -e
          mkdir -p .web3guard
          printf '%s\n' "$TARGETS_CONFIG" > .web3guard/targets.txt
          if ! grep -q '[^[:space:]]' .web3guard/targets.txt; then
            echo "::warning::No targets configured; set WEB3GUARD_TARGETS_CONFIG for scheduled runs."
            exit 0
          fi

          EXTRAS=()
          if [ -n "$FORK_URL" ]; then
            EXTRAS+=(--fork-url "$FORK_URL")
          fi
          if [ "$ENABLE_EXPLOIT" != "true" ]; then
            EXTRAS+=(--no-exploit)
          fi
          if [ "$ENABLE_SELF_CRITIQUE" != "true" ]; then
            EXTRAS+=(--no-self-critique)
          fi

          failures=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::group::Scanning $line"
            if ! python -m web3guard.cli scan "$line" \
              --min-severity "$MIN_SEVERITY" \
              "${EXTRAS[@]}"; then
              echo "::error::Scan failed for $line"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done < .web3guard/targets.txt

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures scan(s) failed"
            exit 1
          fi

      - name: Render dashboard
        if: always()
        run: |
          python -m web3guard.cli dashboard | tee web3guard-dashboard.txt || true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web3guard-report-${{ github.run_id }}
          path: |
            reports/
            web3guard-dashboard.txt
            .web3guard/findings.db
            .web3guard/cost.db
          if-no-files-found: warn
