[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3guard-bounty-hunter"
version = "3.0.0"
description = "Multi-language Web3 smart contract vulnerability scanner with AI-driven semantic reasoning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Web3Guard Contributors" }]
keywords = [
    "web3", "smart-contract", "security", "audit", "vulnerability-scanner",
    "ethereum", "solidity", "vyper", "move", "cairo", "clarity", "func",
    "solana", "anchor", "bug-bounty", "immunefi", "sherlock",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.30.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
slither = ["slither-analyzer>=0.10"]
mythril = ["mythril>=0.24"]
semgrep = ["semgrep>=1.40"]

[project.scripts]
web3guard = "web3guard.cli:main"

[project.urls]
Homepage = "https://github.com/web3guard-bounty-hunter"
Documentation = "https://github.com/web3guard-bounty-hunter/blob/main/README.md"
Issues = "https://github.com/web3guard-bounty-hunter/issues"

[tool.setuptools]
packages = [
    "web3guard",
    "web3guard.ai",
    "web3guard.discovery",
    "web3guard.languages",
    "web3guard.reports",
    "web3guard.sandbox",
    "web3guard.security",
    "web3guard.utils",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
